<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Éter Chat & Red Social</title>
  
  <!-- Configuración PWA para instalación móvil -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Nunito', sans-serif; 
      background-color: #090d16; 
      color: #f8fafc; 
      touch-action: manipulation; 
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .font-heading { font-family: 'Fredoka', sans-serif; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .glow-effect { animation: pulseGlow 3s infinite ease-in-out; }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100 select-none">

  <!-- PANTALLA DE AUTENTICACIÓN -->
  <div id="authScreen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex flex-col justify-center p-5 transition-all duration-300">
    <div class="bg-slate-900/90 border border-purple-500/30 rounded-3xl w-full max-w-sm mx-auto p-6 shadow-2xl shadow-purple-950/50">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-amber-400 flex items-center justify-center text-white font-bold text-3xl mx-auto mb-3 shadow-lg shadow-purple-500/30 glow-effect">
          ✨
        </div>
        <h2 class="font-heading text-2xl font-bold bg-gradient-to-r from-purple-400 via-pink-300 to-amber-300 bg-clip-text text-transparent">Éter Social</h2>
        <p class="text-xs text-slate-400 mt-1">El chat místico y red social de los dioses</p>
      </div>

      <div class="mb-4">
        <label class="block text-[10px] font-semibold text-purple-300/80 mb-1.5 uppercase tracking-wider">
          <i class="fa-solid fa-globe mr-1"></i> Idioma / Language:
        </label>
        <select id="globalLanguage" class="w-full bg-slate-950 border border-slate-800 text-xs rounded-xl p-3 text-slate-200 focus:outline-none focus:border-purple-500">
          <option value="es">Español (ES)</option>
          <option value="en">English (US)</option>
        </select>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-[10px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute left-3.5 top-3 text-slate-500 text-xs"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" id="authEmail" placeholder="tudios@eter.com" value="zeus@eter.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-semibold text-slate-400 mb-1 uppercase tracking-wider">Contraseña</label>
          <div class="relative">
            <span class="absolute left-3.5 top-3 text-slate-500 text-xs"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="authPassword" placeholder="••••••••" value="123456" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
          </div>
        </div>

        <button onclick="handleAuth()" class="w-full bg-gradient-to-r from-purple-600 via-indigo-600 to-amber-500 hover:from-purple-500 hover:to-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs shadow-lg shadow-purple-500/20 transition active:scale-[0.98] mt-2">
          Ingresar a Éter
        </button>
      </div>
    </div>
  </div>

  <!-- APLICACIÓN MÓVIL PRINCIPAL -->
  <div id="mainApp" class="flex-1 flex flex-col hidden w-full h-full overflow-hidden relative">
    
    <!-- TOP HEADER MÓVIL -->
    <header class="h-14 bg-slate-900/90 border-b border-slate-800/80 px-3 flex items-center justify-between shrink-0 z-20 backdrop-blur-md">
      <div class="flex items-center gap-2.5">
        <button onclick="toggleRoomsDrawer()" class="w-9 h-9 rounded-xl bg-slate-800/80 text-purple-400 flex items-center justify-center active:scale-95 transition border border-purple-500/20">
          <i class="fa-solid fa-bars text-sm"></i>
        </button>
        <div>
          <h1 class="font-heading text-sm font-bold text-purple-200 leading-tight flex items-center gap-1.5" id="currentRoomTitle">
            Hogar Éter
          </h1>
          <p class="text-[10px] text-emerald-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> 
            <span id="roomStatusText">142 Dioses Online</span>
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- BOTÓN DESCARGAR APP MÓVIL -->
        <button onclick="downloadApp()" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold px-2.5 py-1 rounded-full text-[10px] flex items-center gap-1 shadow-md active:scale-95 transition">
          <i class="fa-solid fa-download"></i>
          <span>App Móvil</span>
        </button>

        <div class="bg-amber-500/10 border border-amber-500/30 px-2 py-1 rounded-full flex items-center gap-1">
          <i class="fa-solid fa-star text-amber-400 text-[10px]"></i>
          <span class="text-xs font-bold text-amber-300" id="userKarma">1,250</span>
        </div>
      </div>
    </header>

    <!-- DRAWER DE SALAS Y MENÚ -->
    <div id="roomsDrawerOverlay" onclick="toggleRoomsDrawer()" class="fixed inset-0 bg-slate-950/70 z-30 opacity-0 pointer-events-none transition-opacity duration-300"></div>
    
    <div id="roomsDrawer" class="fixed inset-y-0 left-0 w-72 bg-slate-900/95 border-r border-purple-500/20 z-40 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl backdrop-blur-xl">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-lg">✨</span>
          <h3 class="font-heading text-sm font-bold text-purple-300">Salas de Éter</h3>
        </div>
        <button onclick="toggleRoomsDrawer()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="p-3 border-b border-slate-800">
        <button onclick="downloadApp()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
          <i class="fa-solid fa-mobile-screen-button"></i> Instalar / Descargar App
        </button>
      </div>

      <!-- LISTA DE SALAS -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
        <button onclick="selectRoom('general', 'Hogar Éter', '142 Dioses Online')" class="w-full text-left p-2.5 rounded-2xl flex items-center gap-3 bg-purple-500/15 border border-purple-500/30 text-purple-200 text-xs">
          <span class="w-8 h-8 rounded-xl bg-purple-600/30 flex items-center justify-center text-base shrink-0">🏛️</span>
          <div>
            <p class="font-bold">Hogar Éter</p>
            <p class="text-[10px] text-purple-300/70">Sala Principal</p>
          </div>
        </button>
      </div>
    </div>

    <!-- ÁREA DE CONTENIDO PRINCIPAL -->
    <main class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">
      
      <!-- SECCIÓN CHAT -->
      <div id="sectionChat" class="flex-1 flex flex-col h-full">
        <div id="chatMessages" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
          <div class="flex items-start gap-2 max-w-[85%]">
            <div class="w-8 h-8 rounded-full border border-purple-400 bg-slate-800 flex items-center justify-center text-base shrink-0">🦉</div>
            <div>
              <div class="text-[11px] font-bold text-indigo-300">Atenea</div>
              <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-2xl text-xs text-slate-200">
                ¡Bienvenidos a Éter Chat y Red Social! ✨
              </div>
            </div>
          </div>
        </div>

        <div class="p-2 bg-slate-900/90 border-t border-slate-800/80 shrink-0">
          <div class="flex items-center gap-1.5">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-purple-500">
            <button onclick="sendMessage()" class="w-9 h-9 rounded-xl bg-amber-400 text-slate-950 font-bold flex items-center justify-center shrink-0">
              <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- SECCIÓN RED SOCIAL / FEED -->
      <div id="sectionFeed" class="flex-1 hidden overflow-y-auto custom-scrollbar p-3 space-y-4">
        <!-- CREAR PUBLICACIÓN -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow">
          <textarea id="postInput" placeholder="¿Qué está pasando en el Olimpo hoy?..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 resize-none h-16"></textarea>
          <div class="flex justify-between items-center mt-2">
            <div class="flex gap-2 text-purple-400 text-sm">
              <button class="p-1"><i class="fa-solid fa-image"></i></button>
              <button class="p-1"><i class="fa-solid fa-face-smile"></i></button>
            </div>
            <button onclick="createPost()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs">
              Publicar
            </button>
          </div>
        </div>

        <!-- PUBLICACIONES (FEED) -->
        <div id="feedList" class="space-y-3">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-8 h-8 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400 font-bold text-sm">⚡</div>
              <div>
                <p class="text-xs font-bold text-slate-200">Zeus Supremo</p>
                <p class="text-[9px] text-slate-500">Hace 10 min</p>
              </div>
            </div>
            <p class="text-xs text-slate-300 mb-3">¡Lanzando nuevos rayos de actualización para la red social de Éter! ⚡✨</p>
            <div class="flex items-center gap-4 text-xs text-slate-400 border-t border-slate-800/80 pt-2">
              <button onclick="toggleLike(this)" class="flex items-center gap-1 hover:text-red-400"><i class="fa-regular fa-heart"></i> <span>24</span></button>
              <button class="flex items-center gap-1 hover:text-purple-400"><i class="fa-regular fa-comment"></i> <span>5</span></button>
            </div>
          </div>
        </div>
      </div>

    </main>

    <!-- NAVEGACIÓN INFERIOR (TAB BAR RED SOCIAL) -->
    <nav class="h-14 bg-slate-900 border-t border-slate-800/80 flex items-center justify-around shrink-0 z-20">
      <button onclick="switchTab('chat')" id="tabChatBtn" class="flex flex-col items-center gap-0.5 text-purple-400">
        <i class="fa-solid fa-comments text-base"></i>
        <span class="text-[9px] font-semibold">Chats</span>
      </button>
      <button onclick="switchTab('feed')" id="tabFeedBtn" class="flex flex-col items-center gap-0.5 text-slate-400">
        <i class="fa-solid fa-newspaper text-base"></i>
        <span class="text-[9px] font-semibold">Muro Social</span>
      </button>
    </nav>

  </div>

  <!-- JAVASCRIPT CORREGIDO -->
  <script>
    // ACCESO CONCEDIDO
    function handleAuth() {
      const authScreen = document.getElementById('authScreen');
      const mainApp = document.getElementById('mainApp');
      
      authScreen.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        authScreen.classList.add('hidden');
        mainApp.classList.remove('hidden');
      }, 300);
    }

    // CAMBIAR PESTAÑA (CHAT / FEED)
    function switchTab(tab) {
      const sectionChat = document.getElementById('sectionChat');
      const sectionFeed = document.getElementById('sectionFeed');
      const tabChatBtn = document.getElementById('tabChatBtn');
      const tabFeedBtn = document.getElementById('tabFeedBtn');

      if (tab === 'chat') {
        sectionChat.classList.remove('hidden');
        sectionFeed.classList.add('hidden');
        tabChatBtn.className = "flex flex-col items-center gap-0.5 text-purple-400";
        tabFeedBtn.className = "flex flex-col items-center gap-0.5 text-slate-400";
      } else {
        sectionChat.classList.add('hidden');
        sectionFeed.classList.remove('hidden');
        tabChatBtn.className = "flex flex-col items-center gap-0.5 text-slate-400";
        tabFeedBtn.className = "flex flex-col items-center gap-0.5 text-purple-400";
      }
    }

    // MENÚ LATERAL DRAWER
    function toggleRoomsDrawer() {
      const drawer = document.getElementById('roomsDrawer');
      const overlay = document.getElementById('roomsDrawerOverlay');
      const isOpen = !drawer.classList.contains('-translate-x-full');

      if (isOpen) {
        drawer.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0', 'pointer-events-none');
      } else {
        drawer.classList.remove('-translate-x-full');
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      }
    }

    // ENVIAR MENSAJE DE CHAT
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const chatContainer = document.getElementById('chatMessages');
      const msgHTML = `
        <div class="flex items-start gap-2 max-w-[85%] ml-auto flex-row-reverse">
          <div class="w-8 h-8 rounded-full border border-amber-400 bg-slate-800 flex items-center justify-center text-base shrink-0">⚡</div>
          <div>
            <div class="text-[11px] font-bold text-amber-300 text-right">Tú</div>
            <div class="bg-purple-600 text-white p-2.5 rounded-2xl text-xs shadow">${text}</div>
          </div>
        </div>
      `;
      chatContainer.insertAdjacentHTML('beforeend', msgHTML);
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // CREAR PUBLICACIÓN EN LA RED SOCIAL
    function createPost() {
      const postInput = document.getElementById('postInput');
      const text = postInput.value.trim();
      if (!text) return;

      const feedList = document.getElementById('feedList');
      const postHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-8 h-8 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400 font-bold text-sm">⚡</div>
            <div>
              <p class="text-xs font-bold text-slate-200">Tú (Dios Chibi)</p>
              <p class="text-[9px] text-slate-500">Ahora mismo</p>
            </div>
          </div>
          <p class="text-xs text-slate-300 mb-3">${text}</p>
          <div class="flex items-center gap-4 text-xs text-slate-400 border-t border-slate-800/80 pt-2">
            <button onclick="toggleLike(this)" class="flex items-center gap-1 hover:text-red-400"><i class="fa-regular fa-heart"></i> <span>0</span></button>
            <button class="flex items-center gap-1 hover:text-purple-400"><i class="fa-regular fa-comment"></i> <span>0</span></button>
          </div>
        </div>
      `;
      feedList.insertAdjacentHTML('afterbegin', postHTML);
      postInput.value = '';
    }

    // ME GUSTA
    function toggleLike(btn) {
      const icon = btn.querySelector('i');
      const span = btn.querySelector('span');
      let count = parseInt(span.innerText);

      if (icon.classList.contains('fa-regular')) {
        icon.className = 'fa-solid fa-heart text-red-500';
        span.innerText = count + 1;
      } else {
        icon.className = 'fa-regular fa-heart';
        span.innerText = count - 1;
      }
    }

    // DESCARGAR APP MÓVIL (PWA / APK)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function downloadApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            alert('¡Gracias por instalar Éter Social en tu dispositivo!');
          }
          deferredPrompt = null;
        });
      } else {
        alert('Para descargar / instalar en tu teléfono:\n\n1. Abre el menú del navegador (tres puntos ⋮ arriba a la derecha).\n2. Selecciona "Añadir a la pantalla de inicio" o "Instalar aplicación".');
      }
    }
  </script>
</body>
</html>
